name: Orca Bio
description: 'Orca Bio is a late-stage biotechnology company developing high-precision
  allogeneic cell therapies for the treatment of cancer and autoimmune diseases. Its
  approach engineers purified cell populations, including regulatory T cells, to improve
  patient outcomes while reducing the risks associated with traditional allogeneic
  transplant. Its flagship product, TREGZI, is described as the first FDA-approved
  precision-engineered cell therapy for allogeneic transplant in adults with hematological
  malignancies. Orca Bio is backed by 8vc, DCVC and Lightspeed Venture Partners. The
  company publishes no public API or developer platform; this profile captures its
  identity within the API Evangelist network.'
